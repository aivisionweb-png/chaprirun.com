<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>PARLIAMENT RUSH</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101318;font-family:Arial;color:#fff;touch-action:none}canvas{width:100%;height:100%;display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:18px}.brand{font-weight:900;letter-spacing:3px}.pill{background:#111b;border:1px solid #fff3;border-radius:14px;padding:9px 13px;text-align:right}.pill small{display:block;opacity:.6}#center{position:absolute;inset:0;display:grid;place-items:center;background:#07101ed9}.card{width:min(90%,430px);background:#111923;border:1px solid #fff2;border-radius:25px;padding:30px;text-align:center;box-shadow:0 25px 80px #000b}.card h1{font-size:42px;margin:0 0 8px;letter-spacing:4px}.card p{color:#b9c1ca;line-height:1.6;font-size:13px}.btn{width:100%;border:0;border-radius:14px;padding:16px;font-weight:900;font-size:15px}.choice{display:flex;gap:10px;margin:18px 0}.choice button{flex:1;background:#202b37;color:#fff}.choice button.active{outline:2px solid #fff;background:#334150}.primary{background:#f4f1e8;color:#111}.tip{position:absolute;bottom:18px;width:100%;text-align:center;font-size:11px;opacity:.55}</style></head><body><canvas id="c"></canvas><div id="hud"><div class="top"><div class="brand">PARLIAMENT RUSH<div style="font-size:9px;opacity:.5;margin-top:4px">PARODY ARCADE • FICTIONAL GAME</div></div><div class="pill"><b id="score">0</b><small>SCORE</small></div></div><div class="tip">SWIPE ← → / ARROWS TO MOVE • COLLECT DOCUMENTS • DODGE THE CHAOS</div></div><div id="center"><div class="card"><h1>PARLIAMENT<br>RUSH</h1><p>Pick either character. Both have the same gameplay. Run through a stylized Parliament street, collect files and dodge flying microphones.</p><div class="choice"><button id="m" class="btn active">MODI</button><button id="r" class="btn">RAHUL</button></div><button id="go" class="btn primary">START GAME</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),center=document.getElementById('center');let W,H,d=1,run=false,last=0,score=0,lane=1,target=1,items=[],obs=[],t=0,char='modi';function resize(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function laneX(l,z){return W/2+(l-1)*W*.18*(.25+.75*(1-z))}
function spawn(){if(Math.random()<.75)items.push({l:Math.floor(Math.random()*3),z:1});else obs.push({l:Math.floor(Math.random()*3),z:1})}
function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101a27');g.addColorStop(.45,'#394957');g.addColorStop(1,'#121820');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#27313b';x.fillRect(0,H*.42,W,H*.58);x.fillStyle='#171d24';x.beginPath();x.moveTo(W*.16,H);x.lineTo(W*.43,H*.4);x.lineTo(W*.57,H*.4);x.lineTo(W*.84,H);x.fill();for(let i=0;i<7;i++){x.fillStyle='#d6b45c';x.fillRect(W*.05+i*W*.15,H*.39,55,8)}}
function parliament(){x.fillStyle='#ddd6c8';x.fillRect(W*.36,H*.18,W*.28,H*.23);x.fillStyle='#b4ab9c';for(let i=0;i<9;i++){x.fillRect(W*.375+i*W*.028,H*.19,12,H*.18)}x.fillStyle='#c6bdad';x.beginPath();x.arc(W/2,H*.18,W*.11,Math.PI,0);x.fill();x.fillStyle='#e0d8c8';x.fillRect(W*.28,H*.39,W*.44,9)}
function hero(){let px=W/2+(target-lane)*W*.18,py=H*.82;lane+=(target-lane)*.18;x.save();x.translate(px,py);x.fillStyle='#20252a';x.beginPath();x.roundRect(-27,-76,54,76,16);x.fill();x.fillStyle='#d8c8ad';x.beginPath();x.arc(0,-91,19,0,7);x.fill();x.fillStyle=char==='modi'?'#d77a19':'#253c74';x.fillRect(-21,-111,42,12);if(char==='modi'){x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(-16,-90);x.lineTo(16,-90);x.stroke()}else{x.fillStyle='#111';x.beginPath();x.arc(0,-94,19,0,Math.PI);x.fill()}x.restore()}
function drawItems(){items.forEach(a=>{let z=a.z,px=laneX(a.l,z),py=H*.4+(1-z)*H*.6,s=8+(1-z)*30;x.fillStyle='#e8d8a8';x.fillRect(px-s,py-s*.7,s*2,s*1.4);x.fillStyle='#7b5b2b';x.fillRect(px-s*.7,py-s*.25,s*1.4,2)})}
function drawObs(){obs.forEach(a=>{let z=a.z,px=laneX(a.l,z),py=H*.4+(1-z)*H*.6,s=8+(1-z)*32;x.save();x.translate(px,py);x.rotate(t*3);x.fillStyle='#b83a35';x.fillRect(-s*.9,-s*.18,s*1.8,s*.36);x.fillStyle='#e6e6e6';x.fillRect(-s*.2,-s*.7,s*.4,s*1.4);x.restore()})}
function update(dt){t+=dt;score+=Math.floor(dt*8);scoreEl.textContent=score;if(Math.random()<dt*1.1)spawn();items.forEach(a=>a.z-=dt*.38);obs.forEach(a=>a.z-=dt*.38);for(const a of items)if(a.z<.16&&a.z>.04&&a.l===target){score+=100;a.z=-1}for(const a of obs)if(a.z<.16&&a.z>.04&&a.l===target){score=Math.max(0,score-80);a.z=-1}items=items.filter(a=>a.z>0);obs=obs.filter(a=>a.z>0)}
function render(){bg();parliament();drawItems();drawObs();hero()}function loop(q){if(!run)return;let dt=Math.min(.04,(q-last)/1000||0);last=q;update(dt);render();requestAnimationFrame(loop)}function move(n){target=Math.max(0,Math.min(2,target+n))}let sx=0;addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>30)move(dx>0?1:-1)},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)});document.getElementById('m').onclick=()=>{char='modi';m.classList.add('active');r.classList.remove('active')};document.getElementById('r').onclick=()=>{char='rahul';r.classList.add('active');m.classList.remove('active')};document.getElementById('go').onclick=()=>{center.style.display='none';run=true;last=performance.now();requestAnimationFrame(loop)};render();
</script></body></html>
